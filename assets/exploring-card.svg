<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 185" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="exp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="exp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="940" height="185" rx="14" fill="url(#exp-bg)"/>
  <rect x="1" y="1" width="938" height="183" rx="13" stroke="url(#exp-border)" stroke-width="1.2" fill="none"/>

  <!-- Track 1: Advanced Backend & Concurrency -->
  <g transform="translate(24, 22)">
    <rect width="278" height="140" rx="10" fill="#070b13" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="17">⚙️</text>
    <text x="60" y="37" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Advanced Backend</text>
    
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Low-latency microservices, async event loops, kernel system calls, and high-concurrency socket architectures.</text>
    
    <g transform="translate(16, 102)">
      <rect width="105" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="52" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">System Design</text>
      <rect x="112" y="0" width="120" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="172" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Scalable Architecture</text>
    </g>
  </g>

  <!-- Track 2: Generative AI & Agentic AI -->
  <g transform="translate(331, 22)">
    <rect width="278" height="140" rx="10" fill="#070b13" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="17">🤖</text>
    <text x="60" y="37" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Agentic AI &amp; RAG</text>
    
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Multi-agent orchestration, graph-based decision workflows (LangGraph), semantic embeddings, and vector indices.</text>
    
    <g transform="translate(16, 102)">
      <rect width="85" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="42" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">Agentic AI</text>
      <rect x="92" y="0" width="145" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="164" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Retrieval-Augmentation</text>
    </g>
  </g>

  <!-- Track 3: Large-Scale Software Architecture -->
  <g transform="translate(638, 22)">
    <rect width="278" height="140" rx="10" fill="#070b13" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="17">🏗️</text>
    <text x="60" y="37" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Scalable Systems</text>
    
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Fault-tolerant distributed protocols, resilient checkpoint recovery, database partitioning, and real-time streaming.</text>
    
    <g transform="translate(16, 102)">
      <rect width="115" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="57" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">Fault Tolerance</text>
      <rect x="122" y="0" width="115" height="20" rx="5" fill="#0e172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="179" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Data Modeling</text>
    </g>
  </g>
</svg>