  </defs>

  <!-- Card Body -->
  <rect width="450" height="210" rx="12" fill="url(#card-bg-backend)"/>
  <rect x="1" y="1" width="448" height="208" rx="11" stroke="url(#border-grad-backend)" stroke-width="1.2" fill="none"/>

  <!-- Category Title Header -->
