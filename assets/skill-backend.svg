      <circle cx="10" cy="12" r="2.8" fill="#34d399"/>
      <text x="17" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">FastAPI</text>
    </g>
