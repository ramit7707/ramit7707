      <use href="#gh-icon" x="0" y="2" width="18" height="18"/>
      <text x="26" y="16" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tools &amp; Platforms</text>
      
      <g transform="translate(0, 30)">
        <!-- GIT -->
        <rect x="0" y="0" width="65" height="28" rx="4" fill="#F05032"/>
        <text x="32" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">GIT</text>

        <!-- GITHUB -->
        <rect x="73" y="0" width="90" height="28" rx="4" fill="#181717" stroke="#334155" stroke-width="0.8"/>
        <text x="118" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">GITHUB</text>

        <!-- LINUX -->
        <rect x="171" y="0" width="80" height="28" rx="4" fill="#FCC624"/>
        <text x="211" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#000000" letter-spacing="0.5">LINUX</text>

        <!-- WEBSOCKET -->
        <rect x="259" y="0" width="100" height="28" rx="4" fill="#010101" stroke="#334155" stroke-width="0.8"/>
        <text x="309" y="18" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">WEBSOCKET</text>
      </g>
    </g>

    <!-- 3. Concepts -->
    <g transform="translate(0, 205)">
      <use href="#gh-icon" x="0" y="2" width="18" height="18"/>
      <text x="26" y="16" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Concepts</text>
      
      <g transform="translate(0, 30)">
        <!-- OOP -->
        <rect x="0" y="0" width="58" height="28" rx="4" fill="#4A154B"/>
        <text x="29" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">OOP</text>

        <!-- DSA -->
        <rect x="66" y="0" width="68" height="28" rx="4" fill="#FF6B00"/>
        <text x="100" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">DSA</text>

        <!-- NETWORKING -->
        <rect x="142" y="0" width="125" height="28" rx="4" fill="#007ACC"/>
        <text x="204" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">NETWORKING</text>
      </g>

      <g transform="translate(0, 66)">
        <!-- SYSTEM DESIGN -->
        <rect x="0" y="0" width="125" height="28" rx="4" fill="#68A063"/>
        <text x="62" y="18" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">SYSTEM DESIGN</text>
