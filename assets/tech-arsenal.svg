    <g transform="translate(0, 205)">
      <use href="#gh-icon" x="0" y="2" width="18" height="18"/>
      <text x="26" y="16" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Backend &amp; DB</text>
      
      <g transform="translate(0, 30)">
        <!-- NODE.JS -->
        <rect x="0" y="0" width="95" height="28" rx="4" fill="#339933"/>
        <text x="47" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">NODE.JS</text>

        <!-- EXPRESS.JS -->
        <rect x="103" y="0" width="118" height="28" rx="4" fill="#000000" stroke="#334155" stroke-width="0.8"/>
        <text x="162" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">EXPRESS.JS</text>

        <!-- MONGODB -->
        <rect x="229" y="0" width="105" height="28" rx="4" fill="#47A248"/>
        <text x="281" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">MONGODB</text>
      </g>

      <g transform="translate(0, 66)">
        <!-- MYSQL -->
        <rect x="0" y="0" width="82" height="28" rx="4" fill="#4479A1"/>
        <text x="41" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">MYSQL</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN ==================== -->
  <g transform="translate(495, 75)">
    <!-- 1. AI / ML -->
    <g transform="translate(0, 0)">
      <use href="#gh-icon" x="0" y="2" width="18" height="18"/>
      <text x="26" y="16" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI / ML</text>
      
      <g transform="translate(0, 30)">
        <!-- PYTORCH -->
        <rect x="0" y="0" width="100" height="28" rx="4" fill="#EE4C2C"/>
        <text x="50" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">PYTORCH</text>

        <!-- OPENCV -->
        <rect x="108" y="0" width="95" height="28" rx="4" fill="#5C3EE8"/>
        <text x="155" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">OPENCV</text>

        <!-- NUMPY -->
        <rect x="211" y="0" width="86" height="28" rx="4" fill="#013243"/>
        <text x="254" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">NUMPY</text>
      </g>

      <g transform="translate(0, 66)">
        <!-- PANDAS -->
        <rect x="0" y="0" width="92" height="28" rx="4" fill="#150458"/>
        <text x="46" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">PANDAS</text>
      </g>
    </g>

    <!-- 2. Tools & Platforms -->
