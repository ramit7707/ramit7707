      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Large Language Models (LLMs)</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Model Steering, Evaluation, Context Window Management</text>
      
      <!-- Mini Progress / Capability Meter -->
      <rect x="310" y="14" width="90" height="7" rx="3.5" fill="#162032"/>
      <rect x="310" y="14" width="76" height="7" rx="3.5" fill="url(#bar-grad-ai)"/>
    </g>
    <g transform="translate(0, 40)">
      <rect width="416" height="36" rx="7" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="14" cy="18" r="3" fill="#c084fc"/>
      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Retrieval-Augmented Gen (RAG)</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Semantic Search, Document Splitting, Hybrid Indexing</text>
      
