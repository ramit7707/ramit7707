  <!-- Col 3: Competitive Tiers -->
  <g transform="translate(638, 22)">
    <rect width="278" height="140" rx="10" fill="#070b13" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="17">⚡</text>
    <rect x="180" y="18" width="83" height="20" rx="10" fill="#38bdf8" fill-opacity="0.12"/>
    <text x="221" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">MULTI-TIER</text>

    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Contest Ratings</text>
