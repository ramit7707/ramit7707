<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 185" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ach-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="ach-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="940" height="185" rx="14" fill="url(#ach-bg)"/>
  <rect x="1" y="1" width="938" height="183" rx="13" stroke="url(#ach-border)" stroke-width="1.2" fill="none"/>

  <!-- Col 1: 2000+ Problems Solved -->
  <g transform="translate(24, 22)">
    <rect width="278" height="140" rx="10" fill="#070b13" stroke="#1e293b" stroke-width="0.8"/>
