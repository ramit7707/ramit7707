    <text x="219" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34d399">2000+ SOLVED</text>
    
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Algorithmic Distinction</text>
    <text x="16" y="94" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">2000+ coding problems solved across LeetCode, Codeforces, CodeChef, and AtCoder with deep algorithmic mastery.</text>
  </g>

  <!-- Col 2: Gujarat Rank 18 -->
  <g transform="translate(331, 22)">
