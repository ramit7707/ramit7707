    <rect x="16" y="16" width="34" height="34" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="17">🎓</text>
    <rect x="180" y="18" width="83" height="20" rx="10" fill="#f59e0b" fill-opacity="0.12"/>
    <text x="221" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fbbf24">STATE RANK</text>

    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">All Gujarat Rank 18</text>
    <text x="16" y="94" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Rank 18 in 12th Science board examination across the state of Gujarat, recognizing scholastic and analytical excellence.</text>
