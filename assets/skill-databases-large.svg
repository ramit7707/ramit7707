      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">MongoDB</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Mongoose ODM, Document Modeling, Aggregation Pipelines</text>
      
      <!-- Mini Progress / Capability Meter -->
      <rect x="310" y="14" width="90" height="7" rx="3.5" fill="#162032"/>
      <rect x="310" y="14" width="76" height="7" rx="3.5" fill="url(#bar-grad-db)"/>
    </g>
    <g transform="translate(0, 160)">
      <rect width="416" height="36" rx="7" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="14" cy="18" r="3" fill="#f59e0b"/>
      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">ACID &amp; Transactions</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Concurrency Isolation Levels, Rollbacks, Data Locks</text>
      
      <!-- Mini Progress / Capability Meter -->
      <rect x="310" y="14" width="90" height="7" rx="3.5" fill="#162032"/>
      <rect x="310" y="14" width="76" height="7" rx="3.5" fill="url(#bar-grad-db)"/>
    </g>
    <g transform="translate(0, 200)">
      <rect width="416" height="36" rx="7" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="14" cy="18" r="3" fill="#f59e0b"/>
      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Query Optimization</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">B-Tree Indexing, Execution Plans, Partitioning</text>
      
      <!-- Mini Progress / Capability Meter -->
      <rect x="310" y="14" width="90" height="7" rx="3.5" fill="#162032"/>
      <rect x="310" y="14" width="73" height="7" rx="3.5" fill="url(#bar-grad-db)"/>
