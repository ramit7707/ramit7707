<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 245" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="245" rx="10" fill="#070a12"/>
  <rect x="1" y="1" width="958" height="243" rx="9" stroke="#1e293b" stroke-width="1" fill="none"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="220" cy="110" r="130" fill="#ec4899" fill-opacity="0.15" filter="url(#glow-pink)"/>
  <circle cx="740" cy="110" r="140" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow-cyan)"/>

  <!-- Top-Left Neon Bracket & Text -->
  <path d="M 40 45 L 40 25 L 80 25" stroke="#ec4899" stroke-width="2" fill="none"/>
  <text x="54" y="37" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ec4899" letter-spacing="2">JUDGE CONSOLE v2.0</text>

  <!-- Top-Right Neon Bracket & Text -->
  <path d="M 920 45 L 920 25 L 880 25" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <text x="906" y="37" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4" letter-spacing="2">DA-IICT • 2024-2028</text>

  <!-- Horizontal Center Laser Line -->
  <line x1="40" y1="108" x2="920" y2="108" stroke="url(#laser-line)" stroke-width="1.5"/>

  <!-- Center Hero Title: RAMIT SHERASHIYA -->
  <g transform="translate(480, 115)" text-anchor="middle">
    <text x="-165" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff2a85" letter-spacing="6" filter="url(#glow-pink)">RAMIT</text>
    <text x="-165" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff529a" letter-spacing="6">RAMIT</text>
    
    <text x="135" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#00f2fe" letter-spacing="6" filter="url(#glow-cyan)">SHERASHIYA</text>
    <text x="135" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#38bdf8" letter-spacing="6">SHERASHIYA</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="480" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="3.5">COMPETITIVE PROGRAMMER  •  B.TECH ICT  •  OPEN TO INTERNSHIPS</text>

  <!-- 4 Badges Row -->
  <g transform="translate(195, 162)">
    <!-- CF -->
    <rect x="0" y="0" width="125" height="24" rx="4" fill="#0c1938" stroke="#1d4ed8" stroke-width="1"/>
    <text x="62" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CF PUPIL • 1357</text>

    <!-- LC -->
    <rect x="140" y="0" width="130" height="24" rx="4" fill="#2a0d1e" stroke="#be185d" stroke-width="1"/>
    <text x="205" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f43f5e" letter-spacing="0.5">LC KNIGHT • 1871</text>

    <!-- CC (2 STARS!) -->
    <rect x="285" y="0" width="120" height="24" rx="4" fill="#291807" stroke="#b45309" stroke-width="1"/>
    <text x="345" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="0.5">CC ** • 1582</text>

    <!-- AC -->
    <rect x="420" y="0" width="125" height="24" rx="4" fill="#0a2328" stroke="#0f766e" stroke-width="1"/>
    <text x="482" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14b8a6" letter-spacing="0.5">AC BROWN • 836</text>
  </g>

  <!-- Bottom-Left Bracket & Verdicts Ticker -->
  <path d="M 40 205 L 40 225 L 80 225" stroke="#ec4899" stroke-width="2" fill="none"/>
  <text x="46" y="217" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ec4899" letter-spacing="1.5">VERDICTS</text>

  <!-- Verdicts Sequence -->
  <g transform="translate(425, 217)" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">
    <text x="0" y="0" fill="#10b981">AC</text>
    <text x="22" y="0" fill="#475569">•</text>
    <text x="38" y="0" fill="#10b981">AC</text>
    <text x="60" y="0" fill="#475569">•</text>
    <text x="76" y="0" fill="#f43f5e">WA</text>
    <text x="98" y="0" fill="#475569">•</text>
    <text x="114" y="0" fill="#10b981">AC</text>
    <text x="136" y="0" fill="#475569">•</text>
    <text x="152" y="0" fill="#10b981">AC</text>
    <text x="174" y="0" fill="#475569">•</text>
    <text x="190" y="0" fill="#f59e0b">TLE</text>
    <text x="218" y="0" fill="#475569">•</text>
    <text x="234" y="0" fill="#10b981">AC</text>
    <text x="256" y="0" fill="#475569">•</text>
    <text x="272" y="0" fill="#10b981">AC</text>
    <text x="294" y="0" fill="#475569">•</text>
    <text x="310" y="0" fill="#d946ef">MLE</text>
    <text x="338" y="0" fill="#475569">•</text>
    <text x="354" y="0" fill="#10b981">AC</text>
    <text x="376" y="0" fill="#475569">•</text>
    <text x="392" y="0" fill="#10b981">AC</text>
    <text x="414" y="0" fill="#475569">•</text>
    <text x="430" y="0" fill="#10b981">AC</text>
  </g>

  <!-- Bottom-Right Bracket -->
  <path d="M 920 205 L 920 225 L 880 225" stroke="#06b6d4" stroke-width="2" fill="none"/>
</svg>