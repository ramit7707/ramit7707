<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="940" height="370" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="940" height="370" rx="16" fill="url(#cyber-grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="140" cy="90" r="100" fill="#0284c7" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="840" cy="280" r="120" fill="#7c3aed" fill-opacity="0.16" filter="url(#glow)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="938" height="368" rx="15" stroke="url(#card-border)" stroke-width="1.5" fill="none"/>

  <!-- Terminal Titlebar -->
  <path d="M 1 16 C 1 7.716 7.716 1 16 1 L 924 1 C 932.284 1 939 7.716 939 16 L 939 42 L 1 42 Z" fill="#070b12" fill-opacity="0.8"/>
  <line x1="1" y1="42" x2="939" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <text x="86" y="26" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12" fill="#64748b" font-weight="500">ramit@workstation: ~/portfolio (zsh)</text>

  <!-- Live Pulse Status -->
  <g transform="translate(740, 13)">
    <rect width="175" height="18" rx="9" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="14" cy="9" r="3.5" fill="#10b981"/>
    <text x="26" y="13" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" font-weight="600" letter-spacing="0.5">SYSTEM :: ACTIVE</text>
  </g>

  <!-- Hero Content Left Side -->
  <!-- Top Category Pill -->
  <g transform="translate(40, 68)">
    <rect width="370" height="28" rx="14" fill="url(#pill-bg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="16" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#38bdf8" font-weight="600" letter-spacing="0.8">SOFTWARE ENGINEER  |  AI ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="38" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#cyan-purple)" letter-spacing="-0.5">RAMIT SHERASHIYA</text>

  <!-- Tagline / Mission -->
  <text x="40" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#94a3b8">
    Building Resilient Distributed Systems, Scalable Backends &amp; Agentic AI Workflows
  </text>

  <!-- Terminal Output Block -->
  <g transform="translate(40, 204)">
    <rect width="530" height="132" rx="10" fill="#060a12" stroke="#1e293b" stroke-width="1"/>
    
    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">$ <tspan fill="#f8fafc">ramit.info()</tspan></text>
    
    <text x="18" y="54" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">&gt; <tspan fill="#94a3b8">Core Focus:</tspan> <tspan fill="#38bdf8">Low-Level Systems</tspan> • <tspan fill="#818cf8">Backend Services</tspan> • <tspan fill="#c084fc">GenAI/RAG</tspan></text>
    
    <text x="18" y="78" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">&gt; <tspan fill="#94a3b8">Problem Solving:</tspan> <tspan fill="#34d399" font-weight="600">2000+ Algorithmic Challenges Solved</tspan> <tspan fill="#64748b">(LC/CF/CC/AC)</tspan></text>
    
    <text x="18" y="102" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">&gt; <tspan fill="#94a3b8">Philosophy:</tspan> <tspan fill="#f1f5f9">Clean Schemas, Deterministic Concurrency &amp; Pure Logic</tspan></text>
    
    <!-- Cursor blink -->
    <rect x="438" y="92" width="7" height="13" fill="#38bdf8" fill-opacity="0.8"/>
  </g>

  <!-- Right Side: Telemetry / Quick Highlights Card -->
  <g transform="translate(595, 68)">
    <rect width="305" height="268" rx="12" fill="#070b13" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Card Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 293 0 C 299.627 0 305 5.373 305 12 L 305 36 L 0 36 Z" fill="#0c1424"/>
    <line x1="0" y1="36" x2="305" y2="36" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEM TELEMETRY</text>
    <circle cx="285" cy="18" r="4" fill="#38bdf8"/>

    <!-- Telemetry Row 1: Competitive Programming -->
    <g transform="translate(18, 52)">
      <rect width="269" height="42" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="7" fill="#f59e0b" fill-opacity="0.2"/>
      <circle cx="18" cy="21" r="3.5" fill="#f59e0b"/>
      <text x="34" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Competitive Programming</text>
      <text x="34" y="33" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#34d399" font-weight="600">2000+ Problems Solved</text>
      <text x="210" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">LC 1871</text>
    </g>

    <!-- Telemetry Row 2: Backend Architecture -->
    <g transform="translate(18, 104)">
      <rect width="269" height="42" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="7" fill="#38bdf8" fill-opacity="0.2"/>
      <circle cx="18" cy="21" r="3.5" fill="#38bdf8"/>
      <text x="34" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Backend &amp; OS Systems</text>
      <text x="34" y="33" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">C • POSIX • Node.js • FastAPI</text>
    </g>

    <!-- Telemetry Row 3: AI & LLM Systems -->
    <g transform="translate(18, 156)">
      <rect width="269" height="42" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="7" fill="#c084fc" fill-opacity="0.2"/>
      <circle cx="18" cy="21" r="3.5" fill="#c084fc"/>
      <text x="34" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">AI Engineering</text>
      <text x="34" y="33" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#c084fc">LangGraph • RAG • Vector DBs</text>
    </g>

    <!-- Telemetry Row 4: Database Engineering -->
    <g transform="translate(18, 208)">
      <rect width="269" height="42" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="7" fill="#10b981" fill-opacity="0.2"/>
      <circle cx="18" cy="21" r="3.5" fill="#10b981"/>
      <text x="34" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Databases &amp; Modeling</text>
      <text x="34" y="33" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#34d399">PostgreSQL • MySQL • MongoDB</text>
    </g>
  </g>
</svg>