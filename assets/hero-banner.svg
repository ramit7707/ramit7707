<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.05"/>
      <stop offset="25%" stop-color="#ec4899" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="190" rx="10" fill="#070a12"/>
  <rect x="1" y="1" width="958" height="188" rx="9" stroke="#1e293b" stroke-width="1" fill="none"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="240" cy="95" r="120" fill="#ec4899" fill-opacity="0.14" filter="url(#glow-pink)"/>
  <circle cx="720" cy="95" r="130" fill="#06b6d4" fill-opacity="0.14" filter="url(#glow-cyan)"/>

  <!-- Top-Right Corner Bracket & DA-IICT Tag -->
  <path d="M 920 42 L 920 22 L 880 22" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <text x="906" y="34" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#06b6d4" letter-spacing="2">DA-IICT • 2024-2028</text>

  <!-- Top-Left Corner Bracket (Minimal accent) -->
  <path d="M 40 42 L 40 22 L 80 22" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- Bottom-Left & Bottom-Right Corner Brackets -->
  <path d="M 40 148 L 40 168 L 80 168" stroke="#ec4899" stroke-width="2" fill="none"/>
  <path d="M 920 148 L 920 168 L 880 168" stroke="#06b6d4" stroke-width="2" fill="none"/>

  <!-- Horizontal Center Laser Line -->
  <line x1="40" y1="94" x2="920" y2="94" stroke="url(#laser-line)" stroke-width="1.5"/>

  <!-- Center Hero Title: RAMIT SHERASHIYA -->
  <g transform="translate(480, 102)" text-anchor="middle">
    <text x="-165" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff2a85" letter-spacing="6" filter="url(#glow-pink)">RAMIT</text>
    <text x="-165" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff529a" letter-spacing="6">RAMIT</text>
    
    <text x="135" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#00f2fe" letter-spacing="6" filter="url(#glow-cyan)">SHERASHIYA</text>
    <text x="135" y="0" font-family="'Courier New', monospace, 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#38bdf8" letter-spacing="6">SHERASHIYA</text>
  </g>

  <!-- Subtitle Tagline: COMPETITIVE PROGRAMMER • B.TECH ICT -->
  <text x="480" y="138" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="4">COMPETITIVE PROGRAMMER  •  B.TECH ICT</text>
</svg>