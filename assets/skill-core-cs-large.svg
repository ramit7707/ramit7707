      <text x="24" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Data Structures &amp; Algorithms</text>
      <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">2000+ Solved, Graphs, DP, Trees, Bit Manipulation</text>
      
