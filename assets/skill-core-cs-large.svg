    <text x="18" y="24" text-anchor="middle" font-family="sans-serif" font-size="18">🧠</text>
    
    <text x="48" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Core Computer Science</text>
    <text x="48" y="34" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#94a3b8">// THEORETICAL &amp; APPLIED PILLARS</text>
    
