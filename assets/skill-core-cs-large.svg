<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 365" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="card-bg-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="border-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bar-grad-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="365" rx="14" fill="url(#card-bg-core)"/>
  <rect x="1" y="1" width="458" height="363" rx="13" stroke="url(#border-core)" stroke-width="1.4" fill="none"/>

  <!-- Header -->
  <g transform="translate(22, 20)">
